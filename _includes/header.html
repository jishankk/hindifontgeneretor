<!-- Shared header: logo + share button + 3-line menu that opens a left sidebar drawer (desktop and mobile).
     Self-contained: its CSS and JS live in this file, so every page that includes it works the same.
     Edit the links in the <nav> below to match your real pages. -->
<style>
header.sbh{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--rule,#D9E4E0);padding:0;backdrop-filter:none}
.sbh-in{position:relative;max-width:1228px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px}
.sbh-logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:19px;line-height:1;text-decoration:none;color:var(--ink,#0F1E1A);min-width:0}
.sbh-logo svg{width:22px;height:22px;flex:none;color:var(--accent,#0A6E5A)}
.sbh-logo em{font-style:normal;color:var(--accent,#0A6E5A)}
.sbh-actions{display:flex;align-items:center;gap:8px;flex:none}
.sbh-btn{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--rule,#D9E4E0);background:#fff;color:var(--ink,#0F1E1A);border-radius:10px;padding:0;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.sbh-btn:hover{background:var(--accent-soft,#E6F1ED);border-color:var(--accent,#0A6E5A);color:var(--accent-dark,#064B3E)}
.sbh-btn svg{width:20px;height:20px;display:block}

/* share popover */
.sbh-pop{position:absolute;top:calc(100% + 6px);right:24px;width:268px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--rule,#D9E4E0);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:12px;display:none;z-index:70}
.sbh-pop.open{display:block}
.sbh-pop p{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--ink,#0F1E1A)}
.sbh-sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sbh-sg a,.sbh-sg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:62px;padding:8px 4px;border:1px solid var(--rule,#D9E4E0);border-radius:10px;background:#fff;color:var(--ink,#0F1E1A);font:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
.sbh-sg a:hover,.sbh-sg button:hover{background:var(--accent-soft,#E6F1ED);border-color:var(--accent,#0A6E5A)}
.sbh-sg svg{width:20px;height:20px;display:block}

/* sidebar drawer (outside <header> so position:fixed is relative to the screen) */
.sbo{position:fixed;inset:0;background:rgba(15,30,26,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:1000}
.sbo.open{opacity:1;pointer-events:auto}
.sbd{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);background:#fff;z-index:1001;display:flex;flex-direction:column;transform:translateX(-102%);visibility:hidden;transition:transform .28s ease,visibility 0s linear .28s;box-shadow:8px 0 32px rgba(0,0,0,.18);overflow-y:auto;overscroll-behavior:contain}
.sbd.open{transform:none;visibility:visible;transition:transform .28s ease,visibility 0s}
.sbd-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--rule,#D9E4E0);position:sticky;top:0;background:#fff}
.sbd-close{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--accent,#0A6E5A);border-radius:8px;cursor:pointer;padding:0}
.sbd-close:hover{background:var(--accent-soft,#E6F1ED)}
.sbd-close svg{width:22px;height:22px;display:block}
.sbd nav{padding:10px 10px 24px}
.sbd h2{margin:14px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft,#33433F);opacity:.75}
.sbd nav a{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:9px;color:var(--soft,#33433F);font-size:15px;font-weight:500;text-decoration:none}
.sbd nav a svg{width:19px;height:19px;flex:none;color:var(--accent,#0A6E5A)}
.sbd nav a:hover{background:var(--accent-soft,#E6F1ED);color:var(--ink,#0F1E1A)}
.sbd nav a[aria-current="page"]{background:var(--accent-soft,#E6F1ED);color:var(--ink,#0F1E1A);font-weight:700}
body.sbd-lock{overflow:hidden}
@media(max-width:560px){.sbh-in{padding:8px 16px}.sbh-pop{right:16px}.sbh-logo{font-size:18px}}
@media(prefers-reduced-motion:reduce){.sbd,.sbo{transition:none!important}}
@media print{header.sbh,.sbd,.sbo{display:none!important}}
</style>

<script>
(function(){
  var d=document,$=function(i){return d.getElementById(i);};
  var menuBtn=$("sbhMenu"),drawer=$("sbhDrawer"),ov=$("sbhOverlay"),closeBtn=$("sbhClose");
  var shBtn=$("sbhShare"),pop=$("sbhPop");
  if(!menuBtn||!drawer)return;

  function openDrawer(){
    closePop();
    drawer.classList.add("open");ov.classList.add("open");
    drawer.setAttribute("aria-hidden","false");ov.setAttribute("aria-hidden","false");
    menuBtn.setAttribute("aria-expanded","true");
    d.body.classList.add("sbd-lock");
    setTimeout(function(){closeBtn.focus();},60);
  }
  function closeDrawer(back){
    if(!drawer.classList.contains("open"))return;
    drawer.classList.remove("open");ov.classList.remove("open");
    drawer.setAttribute("aria-hidden","true");ov.setAttribute("aria-hidden","true");
    menuBtn.setAttribute("aria-expanded","false");
    d.body.classList.remove("sbd-lock");
    if(back!==false)menuBtn.focus();
  }
  function closePop(){pop.classList.remove("open");shBtn.setAttribute("aria-expanded","false");}

  menuBtn.addEventListener("click",openDrawer);
  closeBtn.addEventListener("click",function(){closeDrawer();});
  ov.addEventListener("click",function(){closeDrawer();});
  // close after tapping a link (anchor links stay on the same page)
  drawer.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(a)closeDrawer(false);});
  d.addEventListener("keydown",function(e){
    if(e.key==="Escape"){closeDrawer();closePop();}
    // keep Tab focus inside the open drawer
    if(e.key==="Tab"&&drawer.classList.contains("open")){
      var f=drawer.querySelectorAll("a[href],button");if(!f.length)return;
      var first=f[0],last=f[f.length-1];
      if(e.shiftKey&&d.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&d.activeElement===last){e.preventDefault();first.focus();}
    }
  });
  // if the window grows/shrinks while open, nothing breaks; scroll lock is removed when closed

  // ---- share popover ----
  var url=encodeURIComponent(location.origin+location.pathname),
      title=encodeURIComponent(d.title||"Hindi Font Generator");
  function set(id,h){var e=$(id);if(e)e.href=h;}
  set("sbhWa","https://wa.me/?text="+title+"%20"+url);
  set("sbhFb","https://www.facebook.com/sharer/sharer.php?u="+url);
  set("sbhX","https://twitter.com/intent/tweet?url="+url+"&text="+title);
  set("sbhPin","https://pinterest.com/pin/create/button/?url="+url+"&description="+title);
  shBtn.addEventListener("click",function(e){
    e.stopPropagation();
    var o=pop.classList.toggle("open");shBtn.setAttribute("aria-expanded",String(o));
  });
  d.addEventListener("click",function(e){if(!pop.contains(e.target)&&e.target!==shBtn&&!shBtn.contains(e.target))closePop();});
  $("sbhPrint").addEventListener("click",function(){closePop();window.print();});
  $("sbhCopy").addEventListener("click",function(){
    var link=location.origin+location.pathname,lab=$("sbhCopy").querySelector("span");
    function done(ok){lab.textContent=ok?"Copied!":"Copy failed";setTimeout(function(){lab.textContent="Copy link";},1800);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(function(){done(true);}).catch(function(){done(false);});}
    else{var t=d.createElement("textarea");t.value=link;t.style.cssText="position:fixed;left:-9999px";d.body.appendChild(t);t.select();var ok=false;try{ok=d.execCommand("copy");}catch(x){}t.remove();done(ok);}
  });
})();
</script>
